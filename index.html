<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTS-STUDIO Keyboard Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #313338; --panel: #2b2d31; --input: #383a40; --text: #dbdee1;
    --muted: #949ba4; --name: #c9a0ff; --accent: #5865f2; --accent-hi: #4752c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
          letter-spacing: .02em; color: var(--muted); margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; background: var(--input);
    color: var(--text); border: 0; border-radius: 8px; padding: 12px 14px;
    font: inherit; font-size: 16px; line-height: 1.375;
  }
  textarea:focus { outline: 2px solid var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0 28px; }
  .chaos { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; font-size: 14px; color: var(--muted); }
  .chaos input { flex: 1; accent-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 4px;
    padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-hi); }
  button.ghost { background: #4e5058; }
  button.ghost:hover { background: #6d6f78; }
  .chat { background: var(--bg); border-top: 1px solid #3f4147; padding-top: 16px; }
  .msg { display: flex; gap: 16px; padding: 2px 0; }
  .avatar {
    flex: 0 0 40px; height: 40px; border-radius: 50%; background: #111;
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    font-style: italic; letter-spacing: -.5px;
  }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .name { color: var(--name); font-weight: 600; font-size: 16px; }
  .time { color: var(--muted); font-size: 12px; }
  .body { font-size: 16px; line-height: 1.375; white-space: pre-wrap; word-wrap: break-word; min-height: 22px; }
  .body.empty { color: var(--muted); font-style: italic; }
  .toast { color: var(--muted); font-size: 13px; margin-left: 4px; min-width: 60px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>nts-studio-keyboard-simulator</h1>
  <p class="sub">type like flo dill in the nts discord</p>

  <label for="in">Your message</label>
  <textarea id="in" placeholder="Start typing" autofocus></textarea>

  <div class="controls">
    <div class="chaos">
      <span>calm</span>
      <input id="chaos" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Chaos">
      <span>full dill</span>
    </div>
    <button id="reroll" class="ghost" type="button">Re-roll</button>
    <button id="copy" type="button">Copy to clipboard</button>
    <span id="toast" class="toast" aria-live="polite"></span>
  </div>

  <div class="chat">
    <div class="msg">
      <div class="avatar" aria-hidden="true">FD</div>
      <div>
        <div class="head"><span class="name">NTS-STUDIO 🎧</span><span class="time" id="time"></span></div>
        <div class="body" id="out"></div>
      </div>
    </div>
  </div>

  <footer>Same text and same roll give the same output. Press Re-roll for new typos.</footer>
</main>

<script src="simulator.js"></script>
<script>
  const $in = document.getElementById("in");
  const $out = document.getElementById("out");
  const $chaos = document.getElementById("chaos");
  const $toast = document.getElementById("toast");
  let seed = Math.floor(Math.random() * 1e9);

  const now = new Date();
  document.getElementById("time").textContent =
    String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");

  function render() {
    const text = $in.value;
    const result = text.trim() ? ntsSimulate(text, { seed, chaos: Number($chaos.value) }) : "";
    $out.textContent = result || "start typing";
    $out.classList.toggle("empty", !result);
    $out.dataset.text = result;
  }

  $in.addEventListener("input", render);
  $chaos.addEventListener("input", render);
  document.getElementById("reroll").addEventListener("click", () => {
    seed = Math.floor(Math.random() * 1e9);
    render();
  });
  document.getElementById("copy").addEventListener("click", async () => {
    const text = $out.dataset.text || "";
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      $toast.textContent = "copied";
    } catch {
      $toast.textContent = "copy failed";
    }
    setTimeout(() => ($toast.textContent = ""), 1500);
  });

  render();
</script>
</body>
</html>
